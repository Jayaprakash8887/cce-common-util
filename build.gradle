// ==============================================================================
// cce-common-util
// ==============================================================================
// Code shared by cce-protocol-service, cce-matcher-service and cce-compliance-service.
//
// Deliberately NOT a Spring Boot application, and it owns no Flyway migration — each service still
// owns the DDL for the tables it creates.
//
// It does carry JPA. Nine of the thirteen ccedb tables are touched by more than one service, and the
// deviation/intelligence machinery is driven by two of them: Matcher records ORDER_VIOLATION on
// completion while Compliance records OVERDUE/MISSED from a threshold crossing. Duplicating those
// entities and services per repo meant ~550 lines kept in lockstep by hand, with a schema change
// needing three matching edits. One definition here removes that class of drift; the cost is that a
// column change is a common-util change, which is the honest shape of a shared database.
//
// Also here: the vocabulary the services must agree on — status enums, Kafka message contracts, and
// the FHIR reading/evaluation logic that is identical wherever it runs.
//
// Consumed via a Gradle composite build; each service declares:
//     includeBuild '../cce-common-util'
// so there is no artifact to publish and no version to bump during development.
// ==============================================================================
plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '6.3.1.5724'
}

group = 'org.openphc.cce'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Aligns transitive versions with the Spring Boot release the consuming services use, without
// applying the boot plugin (which would try to build an executable jar).
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.2"
    }
}

ext {
    johnzonVersion = '2.0.2'
    hapiVersion = '7.6.0'
}

dependencies {
    // `api` for anything that appears in a public signature, so consumers get it transitively.
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    // GlobalExceptionHandler is a @RestControllerAdvice; every consumer already has web.
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.kafka:spring-kafka'
    api 'io.micrometer:micrometer-core'
    api "ca.uhn.hapi.fhir:hapi-fhir-base:${hapiVersion}"
    api "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiVersion}"
    api 'com.fasterxml.jackson.core:jackson-databind'

    // Required at runtime but never referenced from source — do not remove as "unused".
    // FhirContext needs a hapi-fhir-caching-* module for its internal caches, and HAPI's FHIRPath
    // engine loads org.fhir.ucum classes eagerly (NoClassDefFoundError without it).
    runtimeOnly "ca.uhn.hapi.fhir:hapi-fhir-caching-caffeine:${hapiVersion}"
    runtimeOnly 'org.fhir:ucum:1.0.8'

    // JSONLogic evaluation
    implementation "org.apache.johnzon:johnzon-jsonlogic:${johnzonVersion}"
    implementation "org.apache.johnzon:johnzon-core:${johnzonVersion}"
    implementation 'jakarta.json:jakarta.json-api:2.1.3'

    // @Component on the FHIR services so consumers get them by component scan.
    implementation 'org.springframework:spring-context'
    implementation 'org.slf4j:slf4j-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// The library every service compiles against, so an uncovered change here is an uncovered change
// everywhere. Held just under the measured level rather than at it, so a small refactor does not
// fail the build while a genuinely untested addition does.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

sonar {
    properties {
        property 'sonar.organization', 'openphc'
        property 'sonar.projectKey', 'openphc_cce-common-util'
        // The report jacocoTestReport already emits. Sonar reads coverage from this file rather
        // than measuring anything itself, so the two can only agree.
        property 'sonar.coverage.jacoco.xmlReportPaths',
                 "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
    }
}

// Without this, `gradlew sonar` on a clean checkout uploads with no coverage at all — the task does
// not build the report it reads.
tasks.named('sonar') {
    dependsOn jacocoTestReport
}
